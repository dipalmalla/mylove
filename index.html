<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Good Night ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(180deg,#020617,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    position:relative;
}

/* Stars */
.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* Moon */
.moon{
    position:absolute;
    top:60px;
    right:80px;
    width:120px;
    height:120px;
    border-radius:50%;
    background:#fff7cc;
    box-shadow:
        0 0 30px #fff7cc,
        0 0 80px #fff7cc;
}

.moon::after{
    content:"";
    position:absolute;
    width:110px;
    height:110px;
    background:#0f172a;
    border-radius:50%;
    top:5px;
    left:30px;
}

/* Main card */
.card{
    position:relative;
    z-index:5;
    text-align:center;
    padding:40px;
    width:90%;
    max-width:700px;
    border-radius:30px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 30px rgba(255,255,255,0.1);
    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-size:4rem;
    color:#ff4d6d;
    text-shadow:0 0 20px #ff4d6d;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.06);
    }
}

.message{
    margin-top:20px;
    font-size:1.5rem;
    line-height:1.8;
    min-height:80px;
}

/* Buttons */
.buttons{
    margin-top:35px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-size:1rem;
    font-weight:600;
    transition:0.3s;
}

.loveBtn{
    background:#ff4d6d;
    color:white;
    box-shadow:0 0 15px #ff4d6d;
}

.loveBtn:hover{
    transform:scale(1.08);
}

.hugBtn{
    background:white;
    color:#111827;
}

.hugBtn:hover{
    transform:scale(1.08);
}

/* Floating hearts */
.heart{
    position:absolute;
    bottom:-50px;
    animation:float linear forwards;
    user-select:none;
    pointer-events:none;
}

@keyframes float{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Popup */
.popup{
    position:absolute;
    bottom:40px;
    background:rgba(255,255,255,0.12);
    padding:15px 25px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    opacity:0;
    transition:0.5s;
    z-index:10;
}

.show{
    opacity:1;
}

/* Mobile */
@media(max-width:600px){
    h1{
        font-size:2.5rem;
    }

    .message{
        font-size:1.1rem;
    }
}
</style>
</head>

<body>

<div class="moon"></div>

<div class="card">
    <h1>❤️ I Love You ❤️</h1>

    <div class="message" id="typingText"></div>

    <div class="buttons">
        <button class="loveBtn" onclick="sendLove()">Send Love 💖</button>
        <button class="hugBtn" onclick="virtualHug()">Virtual Hug 🤗</button>
    </div>
</div>

<div class="popup" id="popup">You are special ✨</div>

<script>

/* Typing effect */
const text =
"Good Night 🌙✨\nMay your dreams be filled with happiness, love, and endless smiles ❤️";

let i = 0;

function typeWriter(){
    if(i < text.length){
        document.getElementById("typingText").innerHTML +=
            text.charAt(i) === "\n" ? "<br>" : text.charAt(i);

        i++;
        setTimeout(typeWriter, 45);
    }
}

typeWriter();

/* Stars */
for(let i=0;i<120;i++){
    const star = document.createElement("div");
    star.classList.add("star");

    let size = Math.random()*3;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left = Math.random()*100 + "vw";
    star.style.top = Math.random()*100 + "vh";

    star.style.animationDuration = (1 + Math.random()*4) + "s";

    document.body.appendChild(star);
}

/* Floating hearts */
function createHeart(x = Math.random()*window.innerWidth){
    const heart = document.createElement("div");
    heart.classList.add("heart");

    const emojis = ["❤️","💖","💕","💘","💞"];
    heart.innerHTML = emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left = x + "px";
    heart.style.fontSize = (20 + Math.random()*35) + "px";
    heart.style.animationDuration = (4 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart, 350);

/* Love button */
function sendLove(){
    for(let i=0;i<25;i++){
        setTimeout(()=>{
            createHeart(window.innerWidth/2 + (Math.random()*300 - 150));
        },i*80);
    }

    showPopup("Love sent successfully 💌");
}

/* Hug button */
function virtualHug(){
    showPopup("Sending warm virtual hugs 🤗❤️");
}

/* Popup */
function showPopup(message){
    const popup = document.getElementById("popup");

    popup.innerHTML = message;
    popup.classList.add("show");

    setTimeout(()=>{
        popup.classList.remove("show");
    },2500);
}

/* Click anywhere for hearts */
document.addEventListener("click",(e)=>{
    for(let i=0;i<8;i++){
        setTimeout(()=>{
            createHeart(e.clientX + Math.random()*100 - 50);
        },i*50);
    }
});

</script>

</body>
</html>
