<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Good Night ❤️</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        overflow:hidden;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(to bottom,#0f172a,#1e293b,#000);
        font-family:Arial, sans-serif;
        color:white;
    }

    .container{
        text-align:center;
        z-index:2;
        animation:fadeIn 2s ease;
    }

    h1{
        font-size:4rem;
        color:#ff4d6d;
        text-shadow:0 0 15px #ff4d6d;
    }

    h2{
        margin-top:20px;
        font-size:2rem;
        color:#fff;
    }

    .heart{
        position:absolute;
        bottom:-50px;
        color:#ff4d6d;
        animation:float linear infinite;
        user-select:none;
    }

    @keyframes float{
        0%{
            transform:translateY(0) scale(1);
            opacity:1;
        }
        100%{
            transform:translateY(-110vh) scale(1.5);
            opacity:0;
        }
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:scale(0.8);
        }
        to{
            opacity:1;
            transform:scale(1);
        }
    }

    .moon{
        position:absolute;
        top:50px;
        right:70px;
        width:100px;
        height:100px;
        border-radius:50%;
        background:#fff8dc;
        box-shadow:0 0 30px #fff8dc;
    }

    .moon::after{
        content:"";
        position:absolute;
        top:10px;
        left:25px;
        width:100px;
        height:100px;
        background:#0f172a;
        border-radius:50%;
    }

</style>
</head>
<body>

<div class="moon"></div>

<div class="container">
    <h1>❤️ I Love You ❤️</h1>
    <h2>Good Night My Love 🌙✨</h2>
</div>

<script>
    function createHeart(){
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = ["❤️","💖","💕","💘"][Math.floor(Math.random()*4)];

        heart.style.left = Math.random()*100 + "vw";
        heart.style.fontSize = (20 + Math.random()*30) + "px";
        heart.style.animationDuration = (4 + Math.random()*5) + "s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },9000);
    }

    setInterval(createHeart, 300);
</script>

</body>
</html>
