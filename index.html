<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Greeting ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    font-family:'Poppins',sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position:relative;
    color:white;
    transition:background 2s ease;
}

/* Animated Background Glow */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15), transparent 20%),
        radial-gradient(circle at 80% 30%, rgba(255,192,203,0.15), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 30%);
    animation:bgMove 20s linear infinite;
}

@keyframes bgMove{
    0%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-10%,-10%);
    }
    100%{
        transform:translate(0,0);
    }
}

/* Sun / Moon */
.skyObject{
    position:absolute;
    top:60px;
    right:70px;
    width:120px;
    height:120px;
    border-radius:50%;
    z-index:3;
    transition:all 1.5s ease;
}

/* Stars */
.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.2;}
    to{opacity:1;}
}

/* Clouds */
.cloud{
    position:absolute;
    background:rgba(255,255,255,0.75);
    border-radius:50px;
    opacity:0.7;
    animation:floatCloud linear infinite;
}

.cloud::before,
.cloud::after{
    content:"";
    position:absolute;
    background:inherit;
    border-radius:50%;
}

.cloud::before{
    width:60px;
    height:60px;
    top:-25px;
    left:10px;
}

.cloud::after{
    width:80px;
    height:80px;
    top:-35px;
    right:10px;
}

@keyframes floatCloud{
    from{
        transform:translateX(-300px);
    }
    to{
        transform:translateX(120vw);
    }
}

/* Birds */
.bird{
    position:absolute;
    font-size:24px;
    animation:flyBird 18s linear infinite;
    opacity:0.8;
}

@keyframes flyBird{
    from{
        transform:translateX(-200px);
    }
    to{
        transform:translateX(120vw);
    }
}

/* Fireflies */
.firefly{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ffe066;
    box-shadow:0 0 12px #ffe066;
    animation:fireflyMove 5s ease-in-out infinite alternate;
}

@keyframes fireflyMove{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(40px,-40px);
    }
}

/* Text */
.content{
    z-index:5;
    text-align:center;
    padding:20px;
}

h1{
    font-size:4rem;
    text-shadow:0 0 20px rgba(255,255,255,0.4);
    animation:pulse 2s infinite;
}

.subtitle{
    margin-top:10px;
    font-size:1.7rem;
}

.message{
    margin-top:25px;
    font-size:1.3rem;
    max-width:750px;
    line-height:1.8;
    min-height:90px;
}

/* Buttons */
.buttons{
    margin-top:40px;
    display:flex;
    gap:20px;
    justify-content:center;
    flex-wrap:wrap;
}

button{
    border:none;
    border-radius:50px;
    padding:15px 28px;
    cursor:pointer;
    font-size:1rem;
    font-weight:600;
    transition:0.3s;
}

button:hover{
    transform:scale(1.08);
}

.loveBtn{
    background:#ff4d6d;
    color:white;
    box-shadow:0 0 20px #ff4d6d;
}

.hugBtn{
    background:white;
    color:#111827;
}

/* Floating Hearts */
.heart{
    position:absolute;
    bottom:-50px;
    animation:floatHeart linear forwards;
    pointer-events:none;
}

@keyframes floatHeart{
    0%{
        transform:translateY(0) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

/* Floating Emojis */
.bigEmoji{
    position:absolute;
    font-size:70px;
    animation:emojiPop 2s ease forwards;
    z-index:15;
    pointer-events:none;
}

@keyframes emojiPop{
    0%{
        transform:scale(0.3);
        opacity:0;
    }
    30%{
        transform:scale(1.3);
        opacity:1;
    }
    100%{
        transform:translateY(-150px) scale(1);
        opacity:0;
    }
}

/* Popup */
.popup{
    position:absolute;
    bottom:40px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    padding:15px 24px;
    border-radius:20px;
    opacity:0;
    transition:0.5s;
    z-index:20;
}

.show{
    opacity:1;
}

/* Shooting star */
.shootingStar{
    position:absolute;
    width:2px;
    height:120px;
    background:linear-gradient(white, transparent);
    transform:rotate(45deg);
    animation:shoot 1.2s linear forwards;
}

@keyframes shoot{
    from{
        transform:translate(0,0) rotate(45deg);
        opacity:1;
    }
    to{
        transform:translate(-500px,500px) rotate(45deg);
        opacity:0;
    }
}

/* Pulse */
@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

/* Mobile */
@media(max-width:600px){

    h1{
        font-size:2.5rem;
    }

    .subtitle{
        font-size:1.2rem;
    }

    .message{
        font-size:1rem;
        padding:0 10px;
    }

    .skyObject{
        width:80px;
        height:80px;
        top:30px;
        right:20px;
    }

}

</style>
</head>

<body>

<div class="skyObject" id="skyObject"></div>

<div class="content">

    <h1 id="title"></h1>

    <div class="subtitle" id="subtitle"></div>

    <div class="message" id="typingText"></div>

    <div class="buttons">
        <button class="loveBtn" onclick="sendLove()">Send Love 💖</button>
        <button class="hugBtn" onclick="sendHug()">Virtual Hug 🤗</button>
    </div>

</div>

<div class="popup" id="popup"></div>

<script>

/* TIME THEMES */

const hour = new Date().getHours();

let title = "";
let subtitle = "";
let message = "";
let bg = "";

const skyObject = document.getElementById("skyObject");

if(hour >= 5 && hour < 12){

    title = "☀️ Good Morning ❤️";
    subtitle = "Rise and shine beautiful ✨";
    message = "May your morning begin with happiness, smiles, positivity and endless love 💛";
    bg = "linear-gradient(180deg,#87CEEB,#FFD580,#FFB6C1)";

    skyObject.style.background =
        "radial-gradient(circle,#fff7b0,#FFD700)";

    skyObject.style.boxShadow =
        "0 0 60px #FFD700";

    createBirds();

}
else if(hour >= 12 && hour < 17){

    title = "🌤️ Good Afternoon ❤️";
    subtitle = "Hope your day is amazing ☁️";
    message = "Sending positivity, happiness and warm love for the rest of your day 💖";
    bg = "linear-gradient(180deg,#4facfe,#00f2fe,#fbc2eb)";

    skyObject.style.background =
        "radial-gradient(circle,#fff7b0,#ffb703)";

    skyObject.style.boxShadow =
        "0 0 55px #ffb703";
}
else if(hour >= 17 && hour < 20){

    title = "🌇 Good Evening ❤️";
    subtitle = "A peaceful sunset for you ✨";
    message = "Relax and enjoy this beautiful evening filled with warmth and love 🧡";
    bg = "linear-gradient(180deg,#ff9966,#ff5e62,#2c3e50)";

    skyObject.style.background =
        "radial-gradient(circle,#ffdd99,#ff7b54)";

    skyObject.style.boxShadow =
        "0 0 50px #ff9966";

    createFireflies();
}
else{

    title = "🌙 Good Night ❤️";
    subtitle = "Sweet dreams and endless love ✨";
    message = "May your dreams be peaceful, beautiful and filled with happiness ❤️";
    bg = "linear-gradient(180deg,#020617,#0f172a,#1e293b)";

    skyObject.style.background = "#fff7cc";

    skyObject.style.boxShadow =
        "0 0 40px #fff7cc,0 0 90px #fff7cc";

    skyObject.innerHTML = `
        <div style="
            position:absolute;
            width:100%;
            height:100%;
            background:#0f172a;
            border-radius:50%;
            top:5px;
            left:30px;
        "></div>
    `;

    createStars();
    shootingStars();
}

document.body.style.background = bg;

document.getElementById("title").innerHTML = title;
document.getElementById("subtitle").innerHTML = subtitle;

/* Typing Animation */

let i = 0;

function typeWriter(){

    if(i < message.length){

        document.getElementById("typingText").innerHTML +=
            message.charAt(i);

        i++;

        setTimeout(typeWriter,40);
    }
}

typeWriter();

/* Clouds */

for(let i=0;i<7;i++){

    const cloud = document.createElement("div");

    cloud.classList.add("cloud");

    cloud.style.width =
        (120 + Math.random()*120) + "px";

    cloud.style.height =
        (50 + Math.random()*30) + "px";

    cloud.style.top =
        Math.random()*60 + "vh";

    cloud.style.animationDuration =
        (30 + Math.random()*25) + "s";

    cloud.style.opacity =
        0.2 + Math.random()*0.4;

    document.body.appendChild(cloud);
}

/* Stars */

function createStars(){

    for(let i=0;i<120;i++){

        const star = document.createElement("div");

        star.classList.add("star");

        let size = Math.random()*3;

        star.style.width = size + "px";
        star.style.height = size + "px";

        star.style.left =
            Math.random()*100 + "vw";

        star.style.top =
            Math.random()*100 + "vh";

        star.style.animationDuration =
            (1 + Math.random()*4) + "s";

        document.body.appendChild(star);
    }
}

/* Shooting Stars */

function shootingStars(){

    setInterval(()=>{

        const s = document.createElement("div");

        s.classList.add("shootingStar");

        s.style.top =
            Math.random()*40 + "vh";

        s.style.left =
            Math.random()*100 + "vw";

        document.body.appendChild(s);

        setTimeout(()=>{
            s.remove();
        },1200);

    },4000);
}

/* Birds */

function createBirds(){

    for(let i=0;i<5;i++){

        const bird = document.createElement("div");

        bird.classList.add("bird");

        bird.innerHTML = "🕊️";

        bird.style.top =
            Math.random()*40 + "vh";

        bird.style.animationDuration =
            (15 + Math.random()*10) + "s";

        document.body.appendChild(bird);
    }
}

/* Fireflies */

function createFireflies(){

    for(let i=0;i<40;i++){

        const f = document.createElement("div");

        f.classList.add("firefly");

        f.style.left =
            Math.random()*100 + "vw";

        f.style.top =
            Math.random()*100 + "vh";

        f.style.animationDuration =
            (3 + Math.random()*5) + "s";

        document.body.appendChild(f);
    }
}

/* Floating Hearts */

function createHeart(x = Math.random()*window.innerWidth){

    const heart = document.createElement("div");

    heart.classList.add("heart");

    const emojis =
        ["❤️","💖","💕","💘","💞"];

    heart.innerHTML =
        emojis[Math.floor(Math.random()*emojis.length)];

    heart.style.left = x + "px";

    heart.style.fontSize =
        (20 + Math.random()*35) + "px";

    heart.style.animationDuration =
        (4 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },9000);
}

setInterval(createHeart,350);

/* Love Button */

function sendLove(){

    showPopup("You received love ❤️");

    for(let i=0;i<30;i++){

        setTimeout(()=>{

            createHeart(
                window.innerWidth/2 +
                (Math.random()*400 - 200)
            );

        },i*50);
    }

    giantEmoji("💖");
}

/* Hug Button */

function sendHug(){

    showPopup("A warm hug reached you 🤗❤️");

    giantEmoji("🤗");

    if(navigator.vibrate){
        navigator.vibrate([100,50,100]);
    }
}

/* Giant Emoji Animation */

function giantEmoji(emoji){

    const e = document.createElement("div");

    e.classList.add("bigEmoji");

    e.innerHTML = emoji;

    e.style.left =
        (window.innerWidth/2 - 35) + "px";

    e.style.top =
        (window.innerHeight/2 - 35) + "px";

    document.body.appendChild(e);

    setTimeout(()=>{
        e.remove();
    },2000);
}

/* Popup */

function showPopup(text){

    const popup = document.getElementById("popup");

    popup.innerHTML = text;

    popup.classList.add("show");

    setTimeout(()=>{
        popup.classList.remove("show");
    },2500);
}

/* Click Hearts */

document.addEventListener("click",(e)=>{

    for(let i=0;i<8;i++){

        setTimeout(()=>{

            createHeart(
                e.clientX +
                Math.random()*100 - 50
            );

        },i*40);
    }
});

</script>

</body>
</html>
